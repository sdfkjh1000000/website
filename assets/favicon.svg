    <!-- body curve -->
    <path d="M 22 50 Q 20 35, 35 30 Q 50 26, 60 32 Q 64 38, 62 46 Q 70 46, 76 42 L 82 44 Q 84 48, 80 52 L 74 54 Q 66 58, 58 58 L 50 58 L 40 56 Q 28 56, 22 50 Z"/>
    <!-- tail fan -->
